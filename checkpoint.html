<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 11 Checkpoint</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2133; --panel-2: #222b40; --muted: #9aa4b8; --text: #eef1f7;
    --accent: #f4b400; --accent-ink: #1d2330; --done: #2f6b4a; --done-ink: #cfeedd; --warn: #ff6b4a;
    --trap: #ffb199; --code: #b5d3ff;
    --fs-body: clamp(14px, min(1.4vw, 2.6vh), 28px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: var(--fs-body); line-height: 1.32;
  }
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto auto; }

  header {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 1.6vh 2.2vw; color: var(--muted); font-size: 0.8em;
  }
  header .key {
    color: var(--accent-ink); background: var(--accent); font-weight: 800;
    padding: 0.3em 0.9em; border-radius: 999px; white-space: nowrap;
  }
  header #total { font-variant-numeric: tabular-nums; white-space: nowrap; }

  main {
    display: grid; grid-template-columns: 0.9fr 1.3fr; gap: 2.4vw;
    padding: 0 2.2vw; min-height: 0; align-items: center;
  }
  .left { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  #stageLine { font-size: 1.15em; color: var(--muted); font-weight: 600; }
  #stageLine .pts { color: var(--text); white-space: nowrap; }
  #stageLine .m {
    display: inline-block; background: var(--accent); color: var(--accent-ink); font-weight: 800;
    border-radius: 5px; padding: 0 0.35em;
  }
  #stageLine .when { display: block; font-size: 0.75em; font-weight: 500; margin-top: 0.2em; }
  .clock {
    font-size: clamp(80px, min(14vw, 24vh), 240px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin: 1.2vh 0;
    transition: color .3s;
  }
  #question { font-size: 1.3em; font-weight: 600; }
  #note {
    margin-top: 1.6vh; color: var(--trap); font-size: 0.9em;
    border-left: 4px solid var(--warn); padding: 0.3em 0 0.3em 0.7em;
  }
  #startBtn {
    margin-top: 2.4vh; align-self: flex-start; font: inherit; font-size: 1.4em; font-weight: 800;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 14px;
    padding: 0.5em 1.6em; cursor: pointer; box-shadow: 0 6px 24px rgba(244,180,0,.3);
  }
  #startBtn:hover { filter: brightness(1.08); }

  .right {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vh 1.2vw; min-width: 0; align-content: center;
  }
  .box { background: var(--panel); border-radius: 14px; padding: 1.8vh 1.4vw; min-width: 0; }
  .box.wide { grid-column: 1 / -1; }
  .box h3 { margin: 0 0 0.8vh; color: var(--accent); font-size: 0.78em; letter-spacing: .06em; text-transform: uppercase; }
  .box ul { margin: 0; padding-left: 1.1em; }
  .box li { margin: 0.5vh 0; }
  .box b { color: #fff; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.88em; color: var(--code); }
  .box code { overflow-wrap: anywhere; }

  .steps { display: flex; gap: 0.6vw; list-style: none; padding: 0 !important; margin: 0; }
  .steps li {
    flex: 1; margin: 0; padding: 0.5em 0.6em; border-radius: 10px; background: var(--panel-2);
    color: var(--muted); font-size: 0.85em; line-height: 1.25;
  }
  .steps li .t { display: block; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
  .steps li.past { opacity: .55; }
  .steps li.cur { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .steps li.cur .t { color: var(--accent-ink); }

  .finished { grid-column: 1 / -1; text-align: center; }
  .finished .big { font-size: clamp(40px, 6vw, 110px); font-weight: 800; }
  .finished p { color: var(--muted); font-size: 1.2em; }

  .bar {
    display: flex; height: clamp(40px, 7vh, 72px); margin: 1.6vh 2.2vw 0.6vh;
    border-radius: 8px; overflow: visible; font-size: 0.66em;
  }
  .bar > div {
    position: relative; display: flex; align-items: center; justify-content: center; text-align: center;
    background: #2a3348; color: var(--muted); border-right: 2px solid var(--bg); padding: 0 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar > div:first-child { border-radius: 8px 0 0 8px; }
  .bar > div:last-child { border-radius: 0 8px 8px 0; border-right: 0; }
  .bar > .done { background: var(--done); color: var(--done-ink); }
  .bar > .now { background: var(--accent); color: var(--accent-ink); font-weight: 800; }
  .bar > .now .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.12); }
  .bar > div span { position: relative; overflow: hidden; text-overflow: ellipsis; }
  .bar > div[data-m] { overflow: visible; }
  .bar > div[data-m]::after {
    content: attr(data-m); position: absolute; right: -2px; top: -1.5em; transform: translateX(50%);

    display: flex; justify-content: space-between; align-items: center;

// Mốc gợi ý bên trong CP3 (phút tính từ đầu buổi). Đề không chia, đây là gợi ý của coach.
const SUBSTEPS = [
  { at: 75, label: 'Rate limit + audit + monitoring' },
  { at: 95, label: 'Thứ tự plugin + egress' },
  { at: 105, label: 'run_assignment_suite → results.json' }
];

// "40 điểm", "không tính điểm" cho chặng 0 điểm (Setup, Nộp), hoặc pointsText riêng (Demo).
function pointsLabel(stage) {
  if (stage.pointsText) return stage.pointsText;
  return stage.points > 0 ? stage.points + ' điểm' : 'không tính điểm';
}

const MINUTE_MS = 60000;
const WARNING_MS = 5 * MINUTE_MS;
const TOTAL_MS = SCHEDULE.reduce((sum, s) => sum + s.minutes, 0) * MINUTE_MS;

function stageStartMinute(index) {
  return SCHEDULE.slice(0, index).reduce((sum, s) => sum + s.minutes, 0);
}

function stateAt(elapsedMs) {
  const elapsed = Math.min(Math.max(Number(elapsedMs) || 0, 0), TOTAL_MS);
  const last = SCHEDULE.length - 1;
  if (elapsed >= TOTAL_MS) {
    return { index: last, stage: SCHEDULE[last], remainingMs: 0, elapsedMs: TOTAL_MS,
             totalRemainingMs: 0, finished: true, warning: false };
  }
  let index = 0;
  while ((stageStartMinute(index + 1)) * MINUTE_MS <= elapsed) index++;
  const remainingMs = stageStartMinute(index + 1) * MINUTE_MS - elapsed;
  return { index, stage: SCHEDULE[index], remainingMs, elapsedMs: elapsed,
           totalRemainingMs: TOTAL_MS - elapsed, finished: false, warning: remainingMs <= WARNING_MS };
}

// Chỉ số mốc gợi ý đang chạy trong CP3; -1 nếu không ở CP3.
function currentSubstep(elapsedMs) {
  const st = stateAt(elapsedMs);
  if (st.finished || SCHEDULE[st.index].key !== 'pipeline') return -1;
  let i = -1;
  SUBSTEPS.forEach((s, j) => { if (s.at * MINUTE_MS <= st.elapsedMs) i = j; });
  return i;
}

function formatClock(ms) {
  const totalSec = ms > 0 ? Math.ceil(ms / 1000) : 0;
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// Phút từ đầu buổi → "h:mm" (giống cách CHECKPOINTS.md ghi mốc).
function formatHM(minute) {
  return Math.floor(minute / 60) + ':' + String(minute % 60).padStart(2, '0');
}

// Có cần hỏi xác nhận khi rời / tải lại trang không: chỉ khi đã bấm Bắt đầu và chưa hết 240 phút.
function shouldWarnOnLeave(startMs, nowMs) {
  return startMs !== null && !stateAt(nowMs - startMs).finished;
}

// Xem trước chặng khác: bấm vào ô trên thanh tiến độ. Tự quay về sau PREVIEW_MS.
const PREVIEW_MS = 60000;
function resolveView(liveIndex, previewIndex) {
  if (previewIndex === null || previewIndex === undefined || previewIndex === liveIndex) {
    return { index: liveIndex, preview: false };
  }
  return { index: previewIndex, preview: true };
}
function previewExpired(sinceMs, nowMs) {
  return nowMs - sinceMs >= PREVIEW_MS;
}

// Giữ màn hình máy chiếu không tắt. Trả về Promise của trình duyệt, hoặc null nếu không hỗ trợ / bị từ chối.
function requestWakeLock(nav) {
  try {
    if (!nav || !nav.wakeLock || typeof nav.wakeLock.request !== 'function') return null;
    return nav.wakeLock.request('screen');
  } catch (e) { return null; }
}
</script>

<script id="ui">
// ===== Giao diện: render + vòng lặp đồng hồ + âm báo =====

let lastIndex = null;      // để phát âm khi chuyển chặng trong lúc trang đang mở

function ensureAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
}

function beep() {
  try {
    if (!audioCtx || audioCtx.state !== 'running') return;
    [0, 0.25].forEach(offset => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 880;
      gain.gain.value = 0.15;
      osc.connect(gain).connect(audioCtx.destination);
      const t = audioCtx.currentTime + offset;
      osc.start(t);
      osc.stop(t + 0.15);
    });
  } catch (e) { /* im lặng */ }
}

function buildBar() {
  els.bar.innerHTML = SCHEDULE.map((s, i) =>
    '<div style="flex:' + s.minutes + '"' +
    (s.milestone ? ' data-m="' + s.milestone + ' · ' + formatHM(stageStartMinute(i + 1)) + '"' : '') +
    ' title="' + s.title + ' (' + s.minutes + '\')"><i class="fill"></i><span>' + s.short + '</span></div>'
  ).join('');
}

function list(items) {
  return '<ul>' + items.map(d => '<li>' + d + '</li>').join('') + '</ul>';
}

function renderContent(st, view, sub) {
  const idx = view.index;
  const s = SCHEDULE[idx];
  const isFinished = st.finished;
  const showFinished = isFinished && !view.preview;
  els.main.querySelector('.left').hidden = showFinished;
  els.right.hidden = showFinished;
  finishedEl.hidden = !showFinished;
  els.previewBar.hidden = !view.preview;
  document.body.classList.toggle('preview', view.preview);

  // Thanh tiến độ: done / now theo giờ thật; peek = chặng đang xem trước
  Array.from(els.bar.children).forEach((cell, i) => {
    cell.classList.toggle('done', isFinished || i < st.index);
    cell.classList.toggle('now', !isFinished && i === st.index);
    cell.classList.toggle('peek', view.preview && i === idx);
    if (isFinished || i !== st.index) cell.querySelector('.fill').style.width = '0';
  });
  if (showFinished) return;

  const from = stageStartMinute(idx), to = stageStartMinute(idx + 1);
  els.stageLine.innerHTML = s.title + ' · <span class="pts">' + pointsLabel(s) + '</span>' +
    '<span class="when">' + formatHM(from) + '–' + formatHM(to) + ' · ' + s.rubric +
    (s.milestone ? ' · <span class="m">' + s.milestone + '</span> kiểm tra lúc ' + formatHM(to) : '') + '</span>';
  els.question.textContent = s.goal;
  els.note.textContent = '⚠ ' + s.trap;

  let html =
    '<div class="box wide"><h3>Cần làm</h3>' + list(s.todo) + '</div>' +
    '<div class="box"><h3>Sản phẩm</h3>' + list(s.products) + '</div>' +
    '<div class="box"><h3>Tự kiểm tra</h3>' + list(s.checks) + '</div>';
  if (s.scoring) html += '<div class="box wide"><h3>Luật điểm demo</h3>' + list(s.scoring) + '</div>';
  if (s.key === 'pipeline') {
    const curSub = view.preview ? -1 : sub;
    html += '<div class="box wide"><h3>Mốc gợi ý trong CP3</h3><ol class="steps">' +
      SUBSTEPS.map((x, j) =>
        '<li class="' + (j === curSub ? 'cur' : (curSub > j ? 'past' : '')) + '"><span class="t">' +
        formatHM(x.at) + '</span>' + x.label + '</li>').join('') +
      '</ol></div>';
  }
  els.right.innerHTML = html;
}

function tick() {
  const started = start !== null;
  const elapsedMs = started ? Date.now() - start : 0;
  const st = stateAt(elapsedMs);
  const sub = started ? currentSubstep(elapsedMs) : -1;
  if (previewIndex !== null && previewExpired(previewSince, Date.now())) previewIndex = null;
  const view = resolveView(st.index, previewIndex);
  const key = view.index + (view.preview ? 'p' : '') + (st.finished ? 'f' : '') + 's' + sub;
  if (key !== lastKey) { renderContent(st, view, sub); lastKey = key; }

  const justFinished = st.finished && !tick.wasFinished;
  if (started && lastIndex !== null && (st.index > lastIndex || justFinished)) beep();
  lastIndex = started ? st.index : null;
  tick.wasFinished = st.finished;

  els.clock.textContent = view.preview ? formatClock(SCHEDULE[view.index].minutes * MINUTE_MS) : formatClock(st.remainingMs);
  if (view.preview) {
    els.liveInfo.textContent = !started ? 'chưa bấm Bắt đầu'
      : st.finished ? 'đã hết 240 phút'
      : st.stage.short + ' · còn ' + formatClock(st.remainingMs);
  }
  const elapsedFloor = Math.floor(st.elapsedMs / 1000) * 1000;
  els.total.textContent = 'Đã chạy ' + formatClock(elapsedFloor) + ' / ' + formatClock(TOTAL_MS) +
    ' · Còn ' + formatClock(st.totalRemainingMs);
  document.body.classList.toggle('warning', started && st.warning);
  els.startBtn.hidden = started || view.preview;
  els.soundHint.hidden = !started || st.finished || (audioCtx !== null && audioCtx.state === 'running');

  if (started && !st.finished) {
    const fill = els.bar.children[st.index].querySelector('.fill');
    fill.style.width = (100 * (1 - st.remainingMs / (st.stage.minutes * MINUTE_MS))) + '%';
  }
  document.title = st.finished ? 'Hết giờ · Day 11' : formatClock(st.remainingMs) + ' · ' + st.stage.short;
}
tick.wasFinished = false;

function keepAwake() {
  const p = requestWakeLock(navigator);
  if (p && typeof p.catch === 'function') p.catch(() => {});
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && start !== null) keepAwake();
});

els.startBtn.addEventListener('click', () => {
  ensureAudio();
  keepAwake();
  start = Date.now();
  lastIndex = null;
  tick();
});

document.addEventListener('click', ensureAudio);

function setPreview(i) {
  previewIndex = i;
  previewSince = Date.now();
  tick();
}
function clearPreview() {
  if (previewIndex === null) return;
  previewIndex = null;
  tick();
}
els.bar.addEventListener('click', e => {
  const cell = e.target.closest('.bar > div');
  if (cell) setPreview(Array.from(els.bar.children).indexOf(cell));
});
els.backBtn.addEventListener('click', clearPreview);
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearPreview(); });

// Lỡ bấm reload / đóng tab khi đang chạy: trình duyệt hiện hộp xác nhận (chữ do trình duyệt quyết định).
window.addEventListener('beforeunload', e => {
  if (!shouldWarnOnLeave(start, Date.now())) return;
  e.preventDefault();
  e.returnValue = '';
});

buildBar();
tick();
setInterval(tick, 250);
</script>
</body>
</html>
